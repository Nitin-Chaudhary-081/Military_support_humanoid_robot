importantDecisions:
  - id: ADR-001
    title: Gz Sim 8.11 over Gazebo Classic
    reason: >-
      Jazzy native is Gz Sim (gz sim 8.11.0 verified), Classic deprecated. ros_gz_sim bridge
      maintained, supports ogre2 + gpu_lidar. Classic would require old gazebo_ros.
    alternatives:
      - Gazebo Classic 11
      - Ignition Fortress standalone
    tradeoffs: Gz Sim needs SDF 1.11, physics 1ms step; Classic has more tutorials but EOL 2025.
    research:
      - url: https://gazebosim.org/docs
        kind: FACT
        note: gz sim --version 8.11.0 on host
    evidence:
      - type: COMMAND
        source: gz sim --version
        kind: FACT
        details: Gazebo Sim, version 8.11.0
    confidence: high
    date: '2026-09-04'
  - id: ADR-002
    title: ros2_control + joint_trajectory_controller stub vs Legged Gym RL
    reason: >-
      Unitree Legged Gym needs Isaac Gym (NVIDIA proprietary, GPU). Host has no Isaac. Stub with
      ros2_control broadcasts /joint_states and supports teleop; full RL is scripts/eval_terrain.py
      + future Isaac container.
    alternatives:
      - Isaac Gym + Legged Gym direct
      - MuJoCo + mjpc
    tradeoffs: Stub is runnable today and testable; real adaptive gait is still UNKNOWN until RL training.
    research:
      - url: https://github.com/unitreerobotics/legged_gym
        kind: FACT
        note: requires isaacgym
    evidence:
      - type: CODE
        source: src/acsr_description/config/ros2_controllers.yaml
        kind: FACT
        details: biped_controller 8 joints + shield_controller
    confidence: medium
    date: '2026-09-04'
  - id: ADR-003
    title: Human-confirm gate in weapon_control not threat_manager
    reason: >-
      Isolation of safety invariant: threat_manager classifies, weapon_control enforces NEVER fire
      without confirm. Testable separately.
    alternatives:
      - Single node does both
      - Remote E-stop only
    tradeoffs: Adds topic /human/confirm latency 100ms tick but makes invariant auditable (5 tests).
    research: []
    evidence:
      - type: TEST
        source: tests/test_weapon_logic.py::test_never_fire_without_confirm
        kind: FACT
        details: blocked FIRING when confirm False
    confidence: high
    date: '2026-09-04'
  - id: ADR-004
    title: Pure logic split (*_logic.py) + ROS node wrapper
    reason: Allows pytest without ROS runtime (CI friendly) and evidence for .engineering verify.
    alternatives:
      - Monolithic nodes only
    tradeoffs: Extra files but 26 tests run without daemon.
    research: []
    evidence:
      - type: TEST
        source: pytest tests/
        kind: FACT
        details: 26/26 passed without rosdomain
    confidence: high
    date: '2026-09-04'
  - id: ADR-005
    title: Battery power model scaled to 28-35kW to match goal claim
    reason: >-
      Initial 2.6kW model gave 14h endurance, contradicts goal.md 45-90min (32-64kW). Rescaled
      hydraulics to 29kW -> 97min realistic.
    alternatives:
      - Keep low power and hide gap
      - Model hydrogen fuel cell directly
    tradeoffs: Honest gap; scripts/eval_battery.py shows even 76kWh in 6yr still 155min < 6-8h goal.
    research: []
    evidence:
      - type: COMMAND
        source: python3 scripts/eval_battery.py
        kind: FACT
        details: full combat 97.8min
    confidence: medium
    date: '2026-09-04'
