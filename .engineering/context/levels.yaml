  decisions:
    - file: decisions/ADR-002.yaml
      data:
        id: ADR-002
        title: ros2_control + joint_trajectory_controller stub vs Legged Gym RL
        reason: >-
          Unitree Legged Gym needs Isaac Gym (NVIDIA proprietary, GPU). Host has no Isaac. Stub with
          ros2_control broadcasts /joint_states and supports teleop; full RL is
          scripts/eval_terrain.py + future Isaac container.
        alternatives:
          - Isaac Gym + Legged Gym direct
          - MuJoCo + mjpc
        tradeoffs: >-
          Stub is runnable today and testable; real adaptive gait is still UNKNOWN until RL
          training.
        research:
          - url: https://github.com/unitreerobotics/legged_gym
            kind: FACT
            note: requires isaacgym
        evidence:
          - type: CODE
            source: src/acsr_description/config/ros2_controllers.yaml
            kind: FACT
            details: biped_controller 8 joints + shield_controller
        confidence: medium
        date: '2026-09-04'
    - file: decisions/ADR-003.yaml
      data:
        id: ADR-003
        title: Human-confirm gate in weapon_control not threat_manager
        reason: >-
          Isolation of safety invariant: threat_manager classifies, weapon_control enforces NEVER
          fire without confirm. Testable separately.
        alternatives:
          - Single node does both
          - Remote E-stop only
        tradeoffs: Adds topic /human/confirm latency 100ms tick but makes invariant auditable (5 tests).
        research: []
        evidence:
          - type: TEST
            source: tests/test_weapon_logic.py::test_never_fire_without_confirm
            kind: FACT
            details: blocked FIRING when confirm False
        confidence: high
        date: '2026-09-04'
    - file: decisions/ADR-004.yaml
      data:
        id: ADR-004
        title: Pure logic split (*_logic.py) + ROS node wrapper
        reason: Allows pytest without ROS runtime (CI friendly) and evidence for .engineering verify.
        alternatives:
          - Monolithic nodes only
        tradeoffs: Extra files but 26 tests run without daemon.
        research: []
        evidence:
          - type: TEST
            source: pytest tests/
            kind: FACT
            details: 26/26 passed without rosdomain
        confidence: high
        date: '2026-09-04'
    - file: decisions/ADR-005.yaml
      data:
        id: ADR-005
        title: Battery power model scaled to 28-35kW to match goal claim
        reason: >-
          Initial 2.6kW model gave 14h endurance, contradicts goal.md 45-90min (32-64kW). Rescaled
          hydraulics to 29kW -> 97min realistic.
        alternatives:
          - Keep low power and hide gap
          - Model hydrogen fuel cell directly
        tradeoffs: Honest gap; scripts/eval_battery.py shows even 76kWh in 6yr still 155min < 6-8h goal.
        research: []
        evidence:
          - type: COMMAND
            source: python3 scripts/eval_battery.py
            kind: FACT
            details: full combat 97.8min
        confidence: medium
        date: '2026-09-04'
    - file: decisions/ADR-006.yaml
      data:
        id: ADR-006
        title: Foxglove bridge over RViz/webviz for browser viz
        reason: >-
          Foxglove bridge streams DDS->WebSocket on 8765, works headless/EC2 with app.foxglove.dev,
          supports URDF assets, lidar Image plots, no local RViz needed. RViz requires X11/Docker;
          webviz deprecated. Foxglove open-source, jazzy apt available 3.4.1 verified listening.
        alternatives:
          - RViz2 only
          - webviz
          - rosboard
        tradeoffs: >-
          Adds 10M buffer WebSocket, but zero GUI deps; whitelist ['.*'] exposes all topics; TLS
          optional.
        research:
          - url: https://docs.foxglove.dev/docs/connecting-to-data/frameworks/ros2
            kind: FACT
            note: bridge docs
        evidence:
          - type: COMMAND
            source: timeout 3 ros2 run foxglove_bridge foxglove_bridge
            kind: FACT
            details: Server listening on port 8765
        confidence: high
        date: '2026-09-04'
