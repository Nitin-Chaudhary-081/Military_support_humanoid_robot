# Nav2 params tuned for 450kg biped — slow, high inertia, terrain-aware
# LiDAR costmap from /lidar/points, conservative footprint for shield
amcl:
  ros__parameters:
    use_sim_time: true

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.5
    navigate_to_pose:
      plugin: "nav2_bt_navigator/NavigateToPoseNavigator"
    default_nav_to_pose_bt_xml: "$(find-pkg-share acsr_nav)/behavior_trees/navigate_to_pose.xml"

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 10.0
    progress_checker_plugin: "progress_checker"
    goal_checker_plugin: "goal_checker"
    controller_plugins: ["FollowPath"]
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      max_vel_x: 0.6  # biped max ~0.6 m/s loaded
      max_vel_theta: 0.5
      min_vel_x: -0.2
      acc_lim_x: 0.4
      decel_lim_x: -0.8  # heavy — needs longer braking
      footprint: "[ [0.35, 0.30], [0.35, -0.30], [-0.45, -0.30], [-0.45, 0.30] ]"  # shield-aware

planner_server:
  ros__parameters:
    use_sim_time: true
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: false

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 12
      height: 12
      resolution: 0.05
      footprint: "[ [0.35, 0.30], [0.35, -0.30], [-0.45, -0.30], [-0.45, 0.30] ]"
      plugins: ["voxel_layer", "inflation_layer"]
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        observation_sources: lidar
        lidar:
          topic: /lidar/points
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "PointCloud2"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      width: 40
      height: 40
      resolution: 0.10
      footprint: "[ [0.35, 0.30], [0.35, -0.30], [-0.45, -0.30], [-0.45, 0.30] ]"
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: lidar
        lidar: {topic: /lidar/points, max_obstacle_height: 2.0, clearing: true, marking: true, data_type: "PointCloud2"}
      static_layer: {plugin: "nav2_costmap_2d::StaticLayer", map_subscribe_transient_local: true}
      inflation_layer: {plugin: "nav2_costmap_2d::InflationLayer", cost_scaling_factor: 3.0, inflation_radius: 0.55}
