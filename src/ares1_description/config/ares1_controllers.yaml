controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    ares1_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    # shield/pod/drone removed — weapon-free clean no mounts (re-add after build)

# 26-DOF per arc.md 509 — neck2 + shoulder6 + elbow2 + wrist4 + hip6 + knee2 + ankle4
ares1_controller:
  ros__parameters:
    joints:
      - neck_yaw
      - neck_pitch
      - left_shoulder_yaw
      - left_shoulder_roll
      - left_shoulder_pitch
      - left_elbow
      - left_wrist_pitch
      - left_wrist_roll
      - right_shoulder_yaw
      - right_shoulder_roll
      - right_shoulder_pitch
      - right_elbow
      - right_wrist_pitch
      - right_wrist_roll
      - left_hip_yaw
      - left_hip_roll
      - left_hip_pitch
      - left_knee
      - left_ankle_pitch
      - left_ankle_roll
      - right_hip_yaw
      - right_hip_roll
      - right_hip_pitch
      - right_knee
      - right_ankle_pitch
      - right_ankle_roll
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: true
    constraints:
      goal_time: 0.8
      stopped_velocity_tolerance: 0.05

joint_state_broadcaster:
  ros__parameters: {}
