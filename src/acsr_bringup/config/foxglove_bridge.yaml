# Foxglove bridge config — browser visualization for ACSR sim
# See: https://docs.foxglove.dev/docs/connecting-to-data/frameworks/ros2
# Connect browser to ws://localhost:8765 or via https://app.foxglove.dev
/**:
  ros__parameters:
    port: 8765
    address: "0.0.0.0"
    tls: false
    topic_whitelist: ['.*']
    service_whitelist: ['.*']
    param_whitelist: ['.*']
    client_topic_whitelist: ['.*']
    min_qos_depth: 1
    max_qos_depth: 10
    num_threads: 0
    send_buffer_limit: 10000000
    use_sim_time: true
    include_hidden: false
    asset_uri_allowlist: ['^package://(?:[-\\w%]+/)*[-\\w%.]+\\.(?:dae|fbx|glb|gltf|jpeg|jpg|mtl|obj|png|stl|tif|tiff|urdf|webp|xacro)$']
