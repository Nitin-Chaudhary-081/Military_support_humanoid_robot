controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    # Simulated biped joints — effort controllers for hydraulic actuation
    biped_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    shield_controller:
      type: joint_trajectory_controller/JointTrajectoryController

biped_controller:
  ros__parameters:
    joints:
      - left_hip_pitch
      - left_knee
      - left_ankle
      - right_hip_pitch
      - right_knee
      - right_ankle
      - head_yaw
      - right_shoulder
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: true
    constraints:
      goal_time: 0.6
      stopped_velocity_tolerance: 0.05

shield_controller:
  ros__parameters:
    joints: [shield_pivot]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 50.0
    constraints:
      goal_time: 0.8
      stopped_velocity_tolerance: 0.05

joint_state_broadcaster:
  ros__parameters:
    extra_joints: []
